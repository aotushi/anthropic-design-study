name: Document checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check links, images, source evidence, and counts
        run: python scripts/validate.py
      - name: Recalculate limited contrast and viewport checks
        run: |
          python scripts/analyze.py
          git diff --exit-code -- data/derived-checks.json
